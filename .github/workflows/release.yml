name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Ensure tag is on master
        run: |
          git fetch origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "Tag is not on master"
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test -race ./...

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set build date
        run: echo "BUILD_DATE=$(date --utc --rfc-3339=seconds)" >> "$GITHUB_ENV"

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
            GIT_REF=${{ github.sha }}
            BUILD_DATE=${{ env.BUILD_DATE }}
          tags: |
            ghcr.io/scottbass3/altcha-server:${{ github.ref_name }}
            ghcr.io/scottbass3/altcha-server:latest

      - name: Build release artifacts
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --skip=publish
        env:
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}

      - name: Generate release notes
        run: |
          tag="${GITHUB_REF_NAME}"
          previous_tag=$(git tag --sort=-v:refname | sed -n '2p')
          if [ -n "$previous_tag" ]; then
            log=$(git log "${previous_tag}..${tag}" --pretty=format:"- %h %s")
          else
            log=$(git log "${tag}" --pretty=format:"- %h %s")
          fi

          printf '## Changelog\n' > release-notes.md
          printf '%s\n\n' "$log" >> release-notes.md
          printf '## Container Image\n`docker pull ghcr.io/scottbass3/altcha-server:%s`\n' "$tag" >> release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
