name: test

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
      memcached:
        image: memcached:1.6-alpine
        ports:
          - 11211:11211
    env:
      ALTCHA_TEST_REDIS_URL: redis://localhost:6379/0
      ALTCHA_TEST_MEMCACHED: localhost:11211
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Check go.mod is tidy
        run: go mod tidy -diff

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Vulnerability check
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: ""
          go-version-file: go.mod
          check-latest: false
          cache: false
          repo-checkout: false
